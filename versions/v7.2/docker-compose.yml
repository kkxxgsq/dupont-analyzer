services:
  dupont-analyzer:
    build: .
    container_name: dupont-analyzer
    restart: unless-stopped
    ports:
      - "8765:8765"
    volumes:
      - dupont-cache:/app/cache
      - dupont-akshare:/root/.akshare
    environment:
      - TZ=Asia/Shanghai
      - PYTHONUNBUFFERED=1
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8765/', timeout=5)\""]
      interval: 120s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 256M

volumes:
  dupont-cache:
  dupont-akshare:
